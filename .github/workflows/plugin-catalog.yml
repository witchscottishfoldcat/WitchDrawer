name: Plugin catalog
on:
  pull_request:
    paths: ['plugins/**', 'tools/PluginCatalog/**', 'src/WitchDrawer.Core/Plugins/**', 'Directory.Build.props', '.gitignore', '.gitmodules', '.github/workflows/plugin-catalog.yml']
  push:
    branches: [main]
    paths: ['plugins/**', 'tools/PluginCatalog/**', 'src/WitchDrawer.Core/Plugins/**', 'Directory.Build.props', '.gitignore', '.gitmodules', '.github/workflows/plugin-catalog.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - name: Validate metadata and generated catalog (no plugin execution)
        run: dotnet run --project tools/PluginCatalog -- --check
